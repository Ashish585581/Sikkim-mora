<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F261E"/>
      <stop offset="50%" stop-color="#16382C"/>
      <stop offset="100%" stop-color="#1B4738"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D2A14E"/>
      <stop offset="100%" stop-color="#F4D98B"/>
    </linearGradient>
    <linearGradient id="mountGrad1" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#245444" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#16382C" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mountGrad2" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#2E6955" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#16382C" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>

  <!-- Mountain Silhouettes -->
  <polygon points="120,280 280,130 440,280" fill="url(#mountGrad1)"/>
  <polygon points="280,130 330,178 300,185 280,165 260,185 280,130" fill="#D2A14E" fill-opacity="0.35"/>
  <polygon points="340,300 520,110 700,300" fill="url(#mountGrad2)"/>
  <polygon points="520,110 570,165 540,172 520,150 500,172 520,110" fill="#D2A14E" fill-opacity="0.45"/>
  <polygon points="-40,320 140,160 320,320" fill="url(#mountGrad1)"/>

  <!-- Subtle Road Ribbon -->
  <path d="M 0,380 Q 250,340 500,370 T 800,350 L 800,500 L 0,500 Z" fill="#0E211A" fill-opacity="0.75"/>
  <path d="M 0,420 Q 300,395 550,410 T 800,395" stroke="#D2A14E" stroke-width="2" stroke-dasharray="16,14" fill="none" opacity="0.4"/>

  <!-- Decorative Badge Top Left -->
  <g transform="translate(40, 40)">
    <rect width="180" height="32" rx="16" fill="#F5E8D0" fill-opacity="0.12" stroke="#D2A14E" stroke-width="1"/>
    <circle cx="20" cy="16" r="5" fill="#22A657"/>
    <text x="34" y="21" font-family="'Outfit', sans-serif, system-ui" font-size="12" font-weight="700" fill="#F4D98B" letter-spacing="1.5">SIKKIMORA CAB</text>
  </g>

  <!-- Stylized Mountain Vehicle Silhouette -->
  <g transform="translate(250, 190)">
    <!-- Shadow beneath car -->
    <ellipse cx="150" cy="170" rx="170" ry="14" fill="#000000" fill-opacity="0.45"/>

    <!-- Vehicle Body Outline -->
    <!-- Main Body Shape -->
    <path d="M 20,130 
             L 35,95 
             L 75,90 
             L 105,42 
             L 215,42 
             L 255,90 
             L 275,98 
             L 285,130 
             L 275,145 
             L 25,145 Z" 
          fill="#1C4032" stroke="#F5E8D0" stroke-width="3" stroke-linejoin="round"/>

    <!-- Cabin Roof Rack -->
    <path d="M 115,35 L 205,35" stroke="#D2A14E" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 125,35 L 125,42 M 160,35 L 160,42 M 195,35 L 195,42" stroke="#D2A14E" stroke-width="2.5"/>
    <!-- Luggage on rack -->
    <rect x="135" y="24" width="50" height="11" rx="3" fill="#D2A14E" fill-opacity="0.6" stroke="#F4D98B" stroke-width="1.5"/>

    <!-- Windows -->
    <path d="M 110,85 L 118,50 L 155,50 L 155,85 Z" fill="#F5E8D0" fill-opacity="0.2" stroke="#F5E8D0" stroke-width="1.5"/>
    <path d="M 163,85 L 163,50 L 210,50 L 245,85 Z" fill="#F5E8D0" fill-opacity="0.2" stroke="#F5E8D0" stroke-width="1.5"/>

    <!-- Character / Body Line -->
    <path d="M 30,105 L 270,105" stroke="#D2A14E" stroke-width="2" stroke-opacity="0.7"/>

    <!-- Headlight & Taillight -->
    <path d="M 28,110 L 38,110 L 36,120 L 26,118 Z" fill="#F4D98B"/>
    <path d="M 276,110 L 282,110 L 280,122 L 274,120 Z" fill="#EF4444"/>

    <!-- Wheels & Arches -->
    <!-- Front Wheel Arch & Wheel -->
    <circle cx="75" cy="145" r="28" fill="#0D1E18" stroke="#D2A14E" stroke-width="3"/>
    <circle cx="75" cy="145" r="17" fill="#1C4032" stroke="#F5E8D0" stroke-width="2"/>
    <circle cx="75" cy="145" r="6" fill="#D2A14E"/>

    <!-- Rear Wheel Arch & Wheel -->
    <circle cx="225" cy="145" r="28" fill="#0D1E18" stroke="#D2A14E" stroke-width="3"/>
    <circle cx="225" cy="145" r="17" fill="#1C4032" stroke="#F5E8D0" stroke-width="2"/>
    <circle cx="225" cy="145" r="6" fill="#D2A14E"/>
  </g>

  <!-- Center Text Subtitle -->
  <text x="400" y="420" text-anchor="middle" font-family="'Outfit', sans-serif, system-ui" font-size="18" font-weight="700" fill="#F5E8D0" letter-spacing="0.5">Verified Himalayan Mountain Fleet</text>
  <text x="400" y="445" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif, system-ui" font-size="13" font-weight="500" fill="#D2A14E" letter-spacing="1">CLEAN • SANITIZED • COMMERCIAL PERMIT</text>
</svg>
